<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Для моей любимой</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            font-family: 'Georgia', serif;
            color: #4a2c2a;
            text-align: center;
            padding: 50px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        /* Плавное появление при загрузке */
        .fade-in {
            animation: fadeIn 2s ease forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        h1 {
            font-size: 4em;
            margin-bottom: 0.2em;
            font-weight: bold;
            animation: slideDown 1.5s ease forwards;
            opacity: 0;
        }
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        p {
            font-size: 1.7em;
            margin-top: 0;
            line-height: 1.4em;
            animation: slideUp 1.5s ease 0.5s forwards;
            opacity: 0;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .heart {
            color: #e94e77;
            font-size: 6em;
            margin-top: 20px;
            animation: pulse 1.5s infinite, fadeIn 2.5s ease forwards;
            opacity: 0;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            color: #6b4a4a;
            font-size: 1em;
            font-style: italic;
            animation: fadeIn 3s ease forwards;
            opacity: 0;
        }

        .photo {
            margin: 30px auto;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(233,78,119,0.6);
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: fadeIn 2s ease forwards;
            opacity: 0;
        }
        .photo:hover {
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 0 25px rgba(233,78,119,0.9);
        }

        button {
            background-color: #e94e77;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 30px;
            margin: 10px 5px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            opacity: 0;
            animation: fadeIn 2.5s ease forwards;
            animation-delay: 2s;
        }
       .button-group {
  display: flex;
  justify-content: center; /* Выравнивание по центру */
  gap: 20px; /* Расстояние между кнопками */
  margin-top: 30px;
}

.link-to-gallery {
  display: inline-block;
  color: #e94e77;
  font-weight: bold;
  text-decoration: none;
  font-size: 1.2em;
  border: 2px solid #e94e77;
  padding: 10px 30px;
  border-radius: 30px;
  transition: background-color 0.3s ease, color 0.3s ease;
  cursor: pointer;
  text-align: center;
}

.link-to-gallery:hover {
  background-color: #e94e77;
  color: white;
}


    </style>
</head>
<body>
    

    <h1>Моей любимой девушке</h1>
    <p>Ты — свет моей жизни, моя радость и вдохновение.<br>Каждый миг с тобой — это счастье.</p>

    <img src="karina.jpg" alt="Любимая девушка" class="photo" />

    <div class="heart">❤️</div>

    <div>
        <button onclick="alert('Ты прекрасна!')">Ты прекрасна</button>
        <button onclick="alert('Я всегда с тобой!')">Я всегда с тобой</button>
    </div>

    <div class="button-group">
  <a href="pochilanya.html" class="link-to-gallery">Посмотреть комплименты</a>
  <a href="gallery.html" class="link-to-gallery">Перейти к гирлянде фотографий</a>
  <a href="compliments.html" class="link-to-gallery">Посмотреть комплименты</a>
</div>

    <audio autoplay loop>
        <source src="muzik.mp3" type="audio/mpeg" />
        Ваш браузер не поддерживает аудио.
    </audio>

    <footer>С любовью, Падла этакая</footer>
</body>
</html>

<button id="countdownTimer" type="button">Загрузка таймера...</button>

<script>
    const endDate = new Date("January 13, 2026 00:00:00").getTime();
    const countdownTimer = document.getElementById("countdownTimer");

    function updateTimer() {
        const now = new Date().getTime();
        const distance = endDate - now;

        if (distance < 0) {
            countdownTimer.innerText = "Наш год отношений завершён! ❤️";
            clearInterval(intervalId);
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        countdownTimer.innerText = `${days} дн ${hours} ч ${minutes} мин ${seconds} с`;
    }

    updateTimer();
    const intervalId = setInterval(updateTimer, 1000);

    // Можно добавить обработчик клика для кнопки, например, чтобы что-то сделать при нажатии
    countdownTimer.addEventListener('click', () => {
        alert('Время идёт, цените каждую секунду ❤️');
    });
</script>

<style>
    #countdownTimer {
        font-size: 3em;
        font-weight: bold;
        background: linear-gradient(135deg, #f78ca0, #f9748f, #fd868c, #fe9a8b);
        padding: 20px 60px;
        border-radius: 40px;
        box-shadow: 0 8px 20px rgba(247, 140, 160, 0.6);
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        user-select: none;
        border: none;
    }

    #countdownTimer:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 30px rgba(247, 140, 160, 0.8);
    }
</style>
