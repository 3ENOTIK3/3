<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Гирлянда фотографий</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffe6f0, #ffd6e8);
            font-family: 'Georgia', serif;
            color: #a33b5a;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 30px;
        }

        /* Контейнер гирлянды с flex-wrap для распределения по странице */
        .garland {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
            overflow-x: visible;
        }

        .garland img {
            height: 280px;
            width: 280px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(163, 59, 90, 0.6);
            cursor: pointer;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .garland img:hover {
            transform: scale(1.1) rotate(3deg);
            box-shadow: 0 8px 20px rgba(163, 59, 90, 0.9);
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #a33b5a;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #a33b5a;
            padding: 10px 25px;
            border-radius: 30px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .back-link:hover {
            background-color: #a33b5a;
            color: white;
        }
        
    </style>
</head>
<body>
    <h1>Гирлянда наших фотографий ❤️</h1>
    <div class="garland">
        <img src="MU7.jpg" alt="Фото гирлянды 1" />
        <img src="MU3.jpg" alt="Фото гирлянды 2" />
        <img src="MU2.jpg" alt="Фото гирлянды 3" />
        <img src="MU4.jpg" alt="Фото гирлянды 4" />
        <img src="MU5.jpg" alt="Фото гирлянды 5" />
        <img src="MU.jpg" alt="Фото гирлянды 6" />
        <img src="MU8.jpg" alt="Фото 7" />
        <img src="MU9.jpg" alt="Фото 8" />
        <img src="MU6.jpg" alt="Фото 9" />
        <img src="MU10.jpg" alt="Фото 10" />
    </div>

    <a href="index.html" class="back-link">Вернуться на главную</a>
</body>
</html>
