<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Обратный таймер</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffe6f0, #ffd6e8);
            font-family: 'Georgia', serif;
            color: #a33b5a;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
        }
        #countdownTimer {
            font-size: 3em;
            font-weight: bold;
            background: white;
            padding: 20px 40px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(163, 59, 90, 0.6);
            user-select: none;
        }
        a {
            color: #a33b5a;
            margin-top: 40px;
            font-size: 1.2em;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #a33b5a;
            padding: 10px 30px;
            border-radius: 30px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        a:hover {
            background-color: #a33b5a;
            color: white;
        }
    </style>
</head>
<body>
    <h1>До  года наших отношений осталось:</h1>
    <div id="countdownTimer">Загрузка таймера...</div>
    <a href="index.html">Вернуться на главную</a>

    <script>
        const endDate = new Date("January 13, 2026 00:00:00").getTime();
        const countdownTimer = document.getElementById("countdownTimer");

        function updateTimer() {
            const now = new Date().getTime();
            const distance = endDate - now;

            if (distance < 0) {
                countdownTimer.innerHTML = "Наш год отношений завершён! ❤️";
                clearInterval(intervalId);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            countdownTimer.innerHTML = `${days} дн ${hours} ч ${minutes} мин ${seconds} с`;
        }

        updateTimer();
        const intervalId = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
